name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            output_name: caps-indicator-setup.exe
          - target: i686-pc-windows-msvc
            arch: x86
            output_name: caps-indicator-setup-x86.exe
          - target: aarch64-pc-windows-msvc
            arch: x64_arm64
            output_name: caps-indicator-setup-arm64.exe
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # The installer embeds the application: build it first.
          cargo build --release --target ${{ matrix.target }} -p caps-indicator
          cargo build --release --target ${{ matrix.target }} -p caps-indicator-installer
          Copy-Item target/${{ matrix.target }}/release/caps-indicator-setup.exe dist/${{ matrix.output_name }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.output_name }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          name: caps-indicator ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
