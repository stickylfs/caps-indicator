[workspace]
resolver = "2"
members = [
    "crates/caps-indicator",
    "crates/caps-indicator-installer",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
authors = ["stickylfs"]
license = "MIT"
repository = "https://github.com/stickylfs/caps-indicator"

[workspace.dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
